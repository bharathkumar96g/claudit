[project]
name = "claudit"
version = "0.1.0"
description = "Local-first audit of what you've shared with Claude. Detects secrets and PII in Claude Code transcripts; stores fingerprints, never raw values."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
]

[project.scripts]
claudit = "claudit.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
